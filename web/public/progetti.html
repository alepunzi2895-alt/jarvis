<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05080d" />
  <title>JARVIS · Claude Code</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%2213%22 fill=%22none%22 stroke=%22%233987e5%22 stroke-width=%223%22/></svg>" />
  <style>
    :root {
      --bg: #05080d; --panel: rgba(14, 22, 34, .72); --line: rgba(57, 135, 229, .22);
      --text: #d8e6f5; --muted: #6f8197; --accent: #3987e5; --cyan: #4fd8ff;
      --ok: #3ddc97; --warn: #f0b429; --err: #ff6b6b; --user: rgba(57, 135, 229, .16);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(circle at 20% 0%, rgba(57, 135, 229, .18), transparent 45%),
        radial-gradient(circle at 90% 100%, rgba(79, 216, 255, .10), transparent 40%),
        var(--bg);
      color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; overflow: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .35;
      background-image: linear-gradient(rgba(57, 135, 229, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(57, 135, 229, .06) 1px, transparent 1px);
      background-size: 42px 42px; mask-image: radial-gradient(circle at 50% 40%, #000, transparent 80%);
    }
    .wrap { position: relative; display: grid; grid-template-columns: 300px 1fr; height: 100%; }
    aside {
      background: var(--panel); border-right: 1px solid var(--line); backdrop-filter: blur(8px);
      display: flex; flex-direction: column; min-height: 0; padding: 14px; gap: 12px;
    }
    .core { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .orb { position: relative; width: 180px; height: 180px; }
    .orb canvas { width: 100%; height: 100%; display: block; }
    .orb-label { font: 600 12px/1 ui-monospace, Consolas, monospace; letter-spacing: .35em; color: var(--cyan); text-shadow: 0 0 10px rgba(79, 216, 255, .6); }
    .orb-state { font: 11px/1 ui-monospace, Consolas, monospace; color: var(--muted); text-transform: uppercase; letter-spacing: .2em; }
    .section-title { font: 600 11px/1 ui-monospace, Consolas, monospace; color: var(--muted); letter-spacing: .25em; text-transform: uppercase; margin: 4px 2px; }
    #projects { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; min-height: 0; }
    .proj {
      display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%;
      background: rgba(255, 255, 255, .02); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 9px 11px; cursor: pointer; font: inherit; text-align: left;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .proj:hover { border-color: rgba(79, 216, 255, .5); }
    .proj.on { border-color: var(--cyan); box-shadow: 0 0 16px rgba(79, 216, 255, .25), inset 0 0 12px rgba(79, 216, 255, .08); background: rgba(79, 216, 255, .07); }
    .proj small { display: block; color: var(--muted); font-size: 11px; }
    .proj .busy { color: var(--warn); font-size: 11px; }
    .usage { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: rgba(255, 255, 255, .02); }
    .usage .row { display: flex; justify-content: space-between; font: 12px/1.6 ui-monospace, Consolas, monospace; color: var(--muted); }
    .usage .row strong { color: var(--text); font-weight: 600; }
    .bar { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .06); overflow: hidden; margin: 2px 0 8px; }
    .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--cyan)); box-shadow: 0 0 8px var(--cyan); width: 0; transition: width .6s; }
    .usage .note { font-size: 10.5px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
    main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    header {
      position: relative; z-index: 10;
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 14px 20px; border-bottom: 1px solid var(--line); background: rgba(5, 8, 13, .6); backdrop-filter: blur(6px);
    }
    #title { font: 600 16px/1.2 ui-monospace, Consolas, monospace; letter-spacing: .08em; color: var(--text); }
    .chip { display: inline-flex; align-items: center; gap: 6px; font: 11px/1 ui-monospace, Consolas, monospace; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; }
    .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .chip.ok::before { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .chip.busy::before { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: pulse 1s infinite; }
    .chip.live::before { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    @keyframes pulse { 50% { opacity: .3; } }
    select#session { background: rgba(255, 255, 255, .03); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: 12px ui-monospace, Consolas, monospace; }
    #log { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 10px; min-height: 0; scroll-behavior: smooth; }
    .m { max-width: 820px; border-radius: 12px; padding: 10px 14px; white-space: pre-wrap; word-break: break-word; border: 1px solid var(--line); background: rgba(14, 22, 34, .6); animation: rise .25s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .m.user { align-self: flex-end; background: var(--user); border-color: rgba(57, 135, 229, .4); }
    .m.text { border-left: 2px solid var(--cyan); }
    .m.result { border-color: rgba(61, 220, 151, .35); background: rgba(61, 220, 151, .06); }
    .m.result.error { border-color: rgba(255, 107, 107, .4); background: rgba(255, 107, 107, .06); }
    .m.error { color: var(--err); font: 12px/1.4 ui-monospace, Consolas, monospace; border: 0; background: none; padding: 0 4px; }
    details.tools { align-self: flex-start; font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--muted); }
    details.tools summary { cursor: pointer; padding: 4px 8px; border: 1px dashed var(--line); border-radius: 8px; list-style: none; }
    details.tools summary::-webkit-details-marker { display: none; }
    details.tools div { padding: 6px 10px; white-space: pre-wrap; word-break: break-all; }
    .hint { color: var(--muted); padding: 24px; font: 13px ui-monospace, Consolas, monospace; }
    form { display: flex; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line); background: rgba(5, 8, 13, .6); }
    textarea {
      flex: 1; resize: none; min-height: 46px; max-height: 180px; background: rgba(255, 255, 255, .03); color: var(--text);
      border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; font: inherit; outline: none;
    }
    textarea:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(79, 216, 255, .25); }
    button { background: linear-gradient(135deg, var(--accent), var(--cyan)); color: #04101c; border: 0; border-radius: 12px; padding: 0 18px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
    button.ghost { background: rgba(255, 255, 255, .04); color: var(--text); border: 1px solid var(--line); font-weight: 500; }
    button:disabled { opacity: .35; cursor: default; }
    #mic.listening { box-shadow: 0 0 0 4px rgba(255, 107, 107, .3); border-color: var(--err); }
    /* Nel pannello: niente elenco laterale, un solo menu a tendina per il progetto */
    .embedded aside, .embedded .usage { display: none; }
    #proj-select { background: var(--panel, #161616); color: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font: inherit; }
    .embedded .wrap { grid-template-columns: 1fr; }
    @media (max-width: 760px) {
      .wrap { grid-template-columns: 1fr; }
      aside { display: none; }  /* sul telefono il progetto si sceglie dal menu a tendina: chat a tutta altezza */
      main { height: calc(100dvh - 8px); }
      .orb { width: 120px; height: 120px; }
      #projects { flex-direction: row; overflow-x: auto; }
      .proj { min-width: 150px; }
      .usage { display: none; }
    }
    header > div { flex-wrap: wrap; }
    header select { font: 12px/1.2 ui-monospace, Consolas, monospace; padding: 5px 8px; border-radius: 10px; background: #0b1118; color: #e8f4ff; border: 1px solid #2a3a52; }
    header select option { background: #0b1118; color: #e8f4ff; }
    @media (max-width: 760px) {
      header { flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
      header select { max-width: 46%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <aside>
      <div class="core">
        <div class="orb"><canvas id="orb-canvas"></canvas></div>
        <div class="orb-label">J.A.R.V.I.S.</div>
        <div class="orb-state" id="orb-state">standby</div>
      </div>
      <div class="section-title">Progetti</div>
      <div id="projects"></div>
      <div class="section-title">Limiti Claude Code</div>
      <div class="usage" id="usage">
        <div class="row"><span>5 h</span><strong id="u5">—</strong></div>
        <div class="bar"><i id="b5"></i></div>
        <div class="row"><span>7 g</span><strong id="u7">—</strong></div>
        <div class="bar"><i id="b7"></i></div>
        <div class="note" id="plan-note">Percentuale del piano letta dalla status line di Claude Code (sessione interattiva aperta).</div>
      </div>
    </aside>
    <main>
      <header>
        <div style="display:flex;gap:10px;align-items:center;min-width:0">
          <select id="proj-select" title="Progetto" style="max-width:180px"></select>
          <span id="title" hidden></span>
          <div class="chip" id="status">offline</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <select id="session" title="Sessione Claude Code collegata" hidden></select>
          <select id="model" title="Modello Claude Code" disabled>
            <option value="">modello: default</option>
            <option value="haiku">haiku</option>
            <option value="sonnet">sonnet</option>
            <option value="opus">opus</option>
          </select>
          <select id="effort" title="Effort Claude Code" disabled>
            <option value="">effort: default</option>
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
            <option value="xhigh">xhigh</option>
            <option value="max">max</option>
          </select>
          <button type="button" class="ghost" id="newsess" title="Nuova sessione Claude Code: cronologia pulita" disabled>Nuova sessione</button>
          <button type="button" class="ghost" id="closesess" title="Chiude la sessione collegata; il prossimo messaggio ne apre una nuova" disabled>Chiudi sessione</button>
          <button type="button" class="ghost" id="stop" disabled>Ferma</button>
        </div>
      </header>
      <div id="log"><div class="hint">&gt; attesa selezione progetto_</div></div>
      <form id="form">
        <textarea id="input" rows="2" placeholder="Comando per Claude Code…" disabled></textarea>
        <button type="button" class="ghost" id="mic" title="Detta il prompt" hidden>🎤</button>
        <button id="send" disabled>Invia</button>
      </form>
    </main>
  </div>
  <script src="/orb.js"></script>
  <script>if (window.top !== window.self) document.documentElement.classList.add("embedded");</script>
  <script src="/progetti.js"></script>
</body>
</html>
