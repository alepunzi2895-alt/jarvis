<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>JARVIS · Progetti</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%2213%22 fill=%22none%22 stroke=%22%233987e5%22 stroke-width=%223%22/></svg>" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    :root { --bg: #0d0d0d; --panel: #161616; --line: #262626; --text: #e8e8e8; --muted: #8a8a8a; --accent: #3987e5; --err: #e5604a; }
    body { background: var(--bg); color: var(--text); margin: 0; font: 15px/1.45 system-ui, sans-serif; }
    .wrap { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
    aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; }
    aside h1 { font-size: 16px; margin: 4px 0 12px; color: var(--accent); }
    .proj { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text); padding: 8px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
    .proj.on { background: #1f2a3a; }
    .proj small { color: var(--muted); display: block; font-size: 12px; }
    .proj .dot { color: #f0b429; }
    main { display: flex; flex-direction: column; min-width: 0; }
    header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; justify-content: space-between; }
    header strong { font-size: 16px; }
    #status { color: var(--muted); font-size: 13px; }
    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .m { max-width: 820px; border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; }
    .m.user { align-self: flex-end; background: #1f2a3a; }
    .m.text { background: var(--panel); border: 1px solid var(--line); }
    .m.result { background: #13231a; border: 1px solid #245a34; }
    .m.result.error { background: #2a1714; border-color: #6a2e24; }
    .m.tool, .m.status, .m.error, .m.session { color: var(--muted); font: 12px/1.4 ui-monospace, Consolas, monospace; background: none; padding: 2px 4px; }
    .m.error { color: var(--err); }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
    textarea { flex: 1; resize: vertical; min-height: 44px; max-height: 200px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 0 16px; font: inherit; cursor: pointer; }
    button.stop { background: #3a3a3a; }
    button:disabled { opacity: .4; cursor: default; }
    .hint { color: var(--muted); padding: 24px; }
    @media (max-width: 720px) {
      .wrap { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px; }
      aside h1 { display: none; }
      .proj { width: auto; white-space: nowrap; }
      main { height: calc(100vh - 110px); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <aside>
      <h1>Progetti</h1>
      <div id="projects"></div>
    </aside>
    <main>
      <header>
        <strong id="title">Scegli un progetto</strong>
        <div><span id="status"></span> <button class="stop" id="stop" disabled>Ferma</button></div>
      </header>
      <div id="log"><div class="hint">Seleziona un progetto per aprire la sua sessione Claude Code.</div></div>
      <form id="form">
        <textarea id="input" rows="2" placeholder="Scrivi a Claude Code su questo progetto…" disabled></textarea>
        <button id="send" disabled>Invia</button>
      </form>
    </main>
  </div>
  <script src="/progetti.js"></script>
</body>
</html>
