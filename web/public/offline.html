<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>JARVIS · PC spento</title>
<style>
  :root {
    --bg: #f5f7fa; --panel: #ffffff; --text: #14181f; --muted: #5c6673;
    --line: #dde3ea; --accent: #3987e5; --warn: #b26a00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0f14; --panel: #131a22; --text: #e8edf3; --muted: #93a0ae;
      --line: #223040; --accent: #3987e5; --warn: #e0a040;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0f14; --panel: #131a22; --text: #e8edf3; --muted: #93a0ae;
    --line: #223040; --accent: #3987e5; --warn: #e0a040;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  main { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-size: 20px; margin: 4px 0 0; font-weight: 600; }
  .status { color: var(--warn); font-size: 14px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .item { border-top: 1px solid var(--line); padding: 10px 0; }
  .item:first-of-type { border-top: 0; padding-top: 0; }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .body { white-space: pre-wrap; word-wrap: break-word; }
  .empty { color: var(--muted); }
  form { display: grid; gap: 10px; }
  textarea {
    width: 100%; min-height: 96px; resize: vertical; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  }
  button {
    min-height: 44px; border: 0; border-radius: 10px; background: var(--accent); color: #fff;
    font: inherit; font-weight: 600; padding: 0 18px; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  .reply { white-space: pre-wrap; word-wrap: break-word; }
  .reply:empty { display: none; }
  .error { color: var(--warn); }
</style>
</head>
<body>
<main>
  <header>
    <h1>JARVIS</h1>
    <div class="status" id="status">PC spento · carico l'ultimo stato…</div>
  </header>

  <section>
    <h2>Ultimo stato del desktop</h2>
    <div id="snapshot"><p class="empty">Nessuno snapshot ancora.</p></div>
  </section>

  <section>
    <h2>Chiedi alla VPS</h2>
    <p class="empty" style="margin:0 0 10px">Risponde con meteo, TradePilot e memoria. Niente Iveco e niente voce finche' il PC e' spento.</p>
    <form id="ask">
      <textarea id="question" maxlength="4000" placeholder="Scrivi una domanda" required></textarea>
      <button id="send" type="submit">Invia</button>
      <div class="reply" id="reply" aria-live="polite"></div>
    </form>
  </section>
</main>
<script>
(function () {
  const status = document.getElementById("status");
  const snapshot = document.getElementById("snapshot");
  const form = document.getElementById("ask");
  const question = document.getElementById("question");
  const send = document.getElementById("send");
  const reply = document.getElementById("reply");

  function text(value) { return value == null ? "" : String(value); }

  function renderItem(item) {
    const row = document.createElement("article");
    row.className = "item";
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = [text(item.at), text(item.source)].filter(Boolean).join(" · ");
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = [item.prompt ? "Tu: " + item.prompt : "", item.text || ""].filter(Boolean).join("\n");
    row.append(meta, body);
    return row;
  }

  function renderSnapshot(data) {
    snapshot.replaceChildren();
    const snap = data.snapshot;
    if (!snap) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "Nessuno snapshot ancora: il PC non ha mai inviato lo stato.";
      snapshot.append(empty);
      status.textContent = "PC spento · nessuno stato del desktop";
      return;
    }
    const minutes = Math.round((data.snapshot_age_sec || 0) / 60);
    const age = minutes < 1 ? "meno di un minuto fa" : minutes < 60 ? minutes + " min fa" : Math.round(minutes / 60) + " h fa";
    status.textContent = "PC spento · ultimo stato " + age + " (" + text(snap.pc_time) + ")";
    if (!snap.feed.length) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "Nessun messaggio nel desktop.";
      snapshot.append(empty);
      return;
    }
    snap.feed.slice().reverse().forEach((item) => snapshot.append(renderItem(item)));
  }

  async function refresh() {
    try {
      const response = await fetch("/offline/state", { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      if (data.pc_alive) { location.reload(); return; }
      renderSnapshot(data);
    } catch (error) {
      status.textContent = "Stato non disponibile: " + error.message;
      status.classList.add("error");
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const value = question.value.trim();
    if (!value) return;
    send.disabled = true;
    reply.classList.remove("error");
    reply.textContent = "Rispondo…";
    try {
      const response = await fetch("/offline/ask", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: value }),
      });
      const data = await response.json();
      if (data.ok) {
        reply.textContent = data.reply;
        question.value = "";
      } else {
        reply.textContent = data.error || "Errore";
        reply.classList.add("error");
        if (response.status === 409) setTimeout(() => location.reload(), 800);
      }
    } catch (error) {
      reply.textContent = "Rete non disponibile: " + error.message;
      reply.classList.add("error");
    } finally {
      send.disabled = false;
    }
  });

  refresh();
  setInterval(refresh, 30000);
})();
</script>
</body>
</html>
